<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - AethrCite</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <div class="brand-logo"></div>
                <h1 class="card-title">Join AethrCite</h1>
                <p class="card-subtitle">Create your professional account</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="johndoe" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="name@company.com" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Clear previous errors
            ['username', 'email', 'password', 'confirmPassword'].forEach(id => UI.clearError(id));

            // Get values
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            let isValid = true;

            if (!username) {
                UI.showError('username', 'Username is required');
                isValid = false;
            }

            if (!email || !UI.isValidEmail(email)) {
                UI.showError('email', 'Please enter a valid email');
                isValid = false;
            }

            if (password.length < 8) {
                UI.showError('password', 'Password must be at least 8 characters');
                isValid = false;
            }

            if (password !== confirmPassword) {
                UI.showError('confirmPassword', 'Passwords do not match');
                isValid = false;
            }

            if (!isValid) return;

            // Attempt Signup
            const result = Auth.signup(username, email, password);
            
            if (result.success) {
                UI.showToast(result.message, 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                UI.showToast(result.message, 'error');
                if (result.message.includes('Email')) {
                    UI.showError('email', result.message);
                }
            }
        });
    </script>
</body>
</html>
