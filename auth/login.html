<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AethrCite</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <div class="brand-logo"></div>
                <h1 class="card-title">Welcome Back</h1>
                <p class="card-subtitle">Sign in to access your dashboard</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="name@company.com" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
                <br><br>
                <a href="#" style="font-size: 0.8rem; color: #71717A;">Forgot password?</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Clear previous errors
            ['email', 'password'].forEach(id => UI.clearError(id));

            // Get values
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validation
            let isValid = true;

            if (!email) {
                UI.showError('email', 'Email is required');
                isValid = false;
            }

            if (!password) {
                UI.showError('password', 'Password is required');
                isValid = false;
            }

            if (!isValid) return;

            // Attempt Login
            const result = Auth.login(email, password);

            if (result.success) {
                UI.showToast('Login successful', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                UI.showToast(result.message, 'error');
                UI.showError('password', 'Credentials do not match'); // Generic placement
            }
        });
    </script>
</body>

</html>
